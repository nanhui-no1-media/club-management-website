<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/static/favicon.ico" />
    <title>南汇一中 · 传媒社</title>
    <script>
      // 首屏防闪烁：在 React 挂载前按已存偏好先落 data-theme。
      // 同时镜像到 Django 后台约定的 theme 键（auto/light/dark），使 /admin/ 自动跟随。
      (function () {
        var k = "cobalt:theme";
        var v = null;
        try { v = localStorage.getItem(k); } catch (e) {}
        var pref = (v === "light" || v === "dark" || v === "system") ? v : "light";
        var resolved = pref === "system"
          ? ((window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light")
          : pref;
        var r = document.documentElement;
        r.dataset.theme = resolved;
        r.style.colorScheme = resolved;
        try { localStorage.setItem("theme", pref === "system" ? "auto" : pref); } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Turnstile api.js 按需加载（见 src/turnstile.ts），未启用时不请求 Cloudflare。 -->
  </body>
</html>
