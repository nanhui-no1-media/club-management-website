name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Test
        run: uv run python manage.py test

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build
        working-directory: frontend
        run: npm ci && npm run build

      - name: Check SurveyJS admin assets
        run: test -f frontend/dist/surveyjs/survey.core.min.js

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 1

  e2e:
    name: e2e
    needs: [frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  release:
    name: release
    needs: [backend, frontend, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Pack tarball
        run: bash scripts/pack-release.sh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA}"
          # GitHub rejects tags that are 40/64 hex (look like commit SHAs).
          TAG="club-${SHA}"
          cp scripts/install.sh install.sh
          ASSETS=("club-${SHA}.tar.gz" "club-${SHA}.tar.gz.sha256" "install.sh")

          PREV_TAG=""
          while IFS= read -r t; do
            [ -n "$t" ] || continue
            if [ "$t" != "$TAG" ]; then
              PREV_TAG="$t"
              break
            fi
          done < <(gh release list --limit 10 --json tagName --jq '.[].tagName' || true)

          NOTES_FILE="$(mktemp)"
          {
            echo "Runtime tree (Django apps + frontend/dist) for \`${SHA}\`."
            echo
            if [ -n "$PREV_TAG" ]; then
              echo "## Changelog"
              echo
              LOG="$(git log --no-merges --pretty=format:'- %s (%h)' "${PREV_TAG}..${SHA}" || true)"
              if [ -n "$LOG" ]; then
                printf '%s\n' "$LOG"
              else
                echo "- No recorded commits since \`${PREV_TAG}\`."
              fi
              echo
              echo "**Full diff:** https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${TAG}"
            else
              echo "Initial packaged release."
            fi
          } > "$NOTES_FILE"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --target "$SHA" \
              --title "$TAG" \
              --notes-file "$NOTES_FILE"
          fi
